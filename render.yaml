# One-click relay on Render (render.com): New > Blueprint > pick this repository.
# After it is live, put  wss://<your-service>.onrender.com  and the RELAY_TOKEN value
# (Render dashboard > the service > Environment) into TeamLink's Settings on every computer.
services:
  - type: web
    name: teamlink-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: RELAY_TOKEN
        generateValue: true

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamLink</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="intake.css"><!-- WHATSAPP-INTAKE -->
</head>
<body>
<div id="app">
  <aside id="side">
    <header id="me">
      <button id="meBtn" class="me-btn" title="Your profile and status">
        <span class="avatar" id="meAvatar"></span>
        <span class="me-text"><b id="meName"></b><small id="meStatus"></small></span>
      </button>
      <button id="multiBtn" class="icon-btn" title="Send one message to several people">✉</button>
      <button id="newGroupBtn" class="icon-btn" title="New group">＋</button>
      <button id="themeBtn" class="icon-btn" title="Appearance: theme, colour, font, wallpaper">🎨</button>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
    </header>
    <div id="updateBanner" hidden></div>
    <div id="searchWrap"><input id="search" type="search" placeholder="Search messages and people" autocomplete="off"></div>
    <div id="banner" hidden></div>
    <nav id="lists">
      <div id="inboxNav" hidden><button id="inboxBtn" class="item"><span class="avatar">📥</span><span class="body"><span class="name">WhatsApp Inbox</span></span><span id="inboxBadge" class="badge" hidden></span></button></div><!-- WHATSAPP-INTAKE -->
      <div id="starNav"><button id="starBtn" class="item"><span class="avatar">⭐</span><span class="body"><span class="name">Starred messages</span></span></button></div>
      <section id="chatSection"><h3>Chats <button id="newGroupLink" title="Create a group chat">＋ New group</button></h3><ul id="convList"></ul></section>
      <section><h3 id="membersTitle">Members</h3><ul id="peerList"></ul></section>
      <section id="resultSection" hidden><h3><span id="resultTitle">Search results</span> <button id="resultClose" title="Close">× Close</button></h3><ul id="resultList"></ul></section>
    </nav>
    <footer id="net"></footer>
  </aside>

  <main id="main">
    <div id="empty">
      <div class="empty-card">
        <h1>TeamLink</h1>
        <p>Pick a teammate or a chat on the left to start. Messages and files travel directly between computers and are encrypted end to end.</p>
      </div>
    </div>
    <div id="chat" hidden>
      <header id="chatHead">
        <button id="backBtn" class="icon-btn" title="Back">←</button>
        <span class="avatar" id="chatAvatar"></span>
        <div class="chat-title"><b id="chatName"></b><small id="chatSub"></small></div>
        <button id="groupEditBtn" class="icon-btn" title="Group members" hidden>👥</button>
        <button id="chatMenuBtn" class="icon-btn" title="Delete conversation">🗑</button>
      </header>
      <div id="pinBar" hidden></div>
      <div id="subBar" hidden></div>
      <div id="messages"></div>
      <div id="dropHint" hidden>Drop files to attach</div>
      <div id="mentionPop" hidden></div>
      <div id="emojiPop" hidden>
        <div id="emojiTabs"></div>
        <input id="emojiSearch" type="search" placeholder="Search emoji" autocomplete="off">
        <div id="emojiGrid"></div>
      </div>
      <div id="typingBar" hidden></div>
      <div id="selBar" hidden></div>
      <footer id="composer">
        <div id="replyBar" hidden></div>
        <div id="attachments"></div>
        <div class="row">
          <button id="emojiBtn" class="icon-btn" title="Emoji">😊</button>
          <button id="attachBtn" class="icon-btn" title="Attach files">📎</button>
          <button id="folderBtn" class="icon-btn" title="Attach a folder" hidden>📁</button>
          <button id="sealBtn" class="icon-btn" title="Sealed message: the receiver must click to open it and you are told when they do">🔒</button>
          <button id="lockBtn" class="icon-btn" title="Locked message: the receiver must type their own lock password to open it">🔑</button>
          <textarea id="input" rows="1" placeholder="Write a message. Paste a screenshot with Ctrl+V."></textarea>
          <button id="sendBtn" class="primary">Send</button>
        </div>
        <input id="fileInput" type="file" multiple hidden>
      </footer>
    </div>
    <div id="inbox" hidden></div><!-- WHATSAPP-INTAKE -->
  </main>
</div>

<div id="modal" hidden><div id="modalCard"></div></div>
<div id="viewer" hidden>
  <img id="viewerImg" alt="" draggable="false">
  <div id="viewerBar">
    <button id="viewerOut" title="Zoom out (-)">−</button><span id="viewerZoom">100%</span><button id="viewerIn" title="Zoom in (+)">＋</button>
    <button id="viewerFit" title="Fit to screen (0)">Fit</button><button id="viewerSave">Save</button><button id="viewerClose" title="Close (Esc)">✕</button>
  </div>
</div>
<div id="toast" hidden></div>
<script src="emoji.js"></script>
<script src="app.js"></script>
<script src="intake.js"></script><!-- WHATSAPP-INTAKE -->
</body>
</html>

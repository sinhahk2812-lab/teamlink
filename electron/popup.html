<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>TeamLink message</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #1f2937; color: #f3f4f6; cursor: pointer; user-select: none;
    border: 1px solid #0d9488; border-left: 5px solid #0d9488; box-sizing: border-box; display: flex; gap: 12px; padding: 12px 14px; }
  img { width: 40px; height: 40px; flex: none; }
  .text { flex: 1; min-width: 0; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 24px; }
  #body { color: #d1d5db; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; margin-top: 2px; }
  #more { color: #5eead4; font-size: 12px; margin-top: 4px; }
  #close { position: absolute; top: 6px; right: 8px; width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: #9ca3af; font-size: 18px; cursor: pointer; }
  #close:hover { background: #374151; color: #fff; }
</style>
</head>
<body>
  <img src="icon.png" alt="">
  <div class="text"><div id="title"></div><div id="body"></div><div id="more"></div></div>
  <button id="close" title="Dismiss">×</button>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'">
<title>TeamLink message</title>
<style>
  :root { --accent: #0d9488; --ink: #f8fafc; --soft: rgba(248,250,252,.78); --tint: 18, 24, 38; --edge: rgba(255,255,255,.34); }
  :root.light { --ink: #0f172a; --soft: rgba(15,23,42,.72); --tint: 250, 250, 255; --edge: rgba(255,255,255,.9); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); user-select: none; padding: 16px 24px 32px; box-sizing: border-box; }
  /* Liquid glass: a tinted translucent slab, a bright rim, a soft specular sweep and a coloured glow underneath. */
  .card { position: relative; height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 16px 22px; cursor: pointer; border-radius: 30px; overflow: hidden;
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 46%, transparent), transparent 58%),
      radial-gradient(90% 120% at 100% 100%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 62%),
      rgba(var(--tint), .74);
    border: 1px solid var(--edge);
    /* every shadow must end inside the window's transparent margin (16px top, 24px sides, 32px bottom), or it is cut off square */
    box-shadow: 0 6px 16px rgba(0,0,0,.30), 0 0 0 1px rgba(0,0,0,.10), 0 5px 14px color-mix(in srgb, var(--accent) 34%, transparent),
      inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.10), inset 0 0 22px rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%); }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.05) 38%, rgba(255,255,255,0) 60%); }
  .card::after { content: ""; position: absolute; top: -60%; bottom: -60%; left: -40%; width: 30%; transform: rotate(18deg); pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.34), transparent); opacity: 0; }
  .card.shine::after { animation: sweep 1.1s ease-out .15s; }
  @keyframes sweep { 0% { left: -40%; opacity: 0; } 20% { opacity: 1; } 100% { left: 125%; opacity: 0; } }
  .badge { position: relative; flex: none; width: 62px; height: 62px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, rgba(255,255,255,.34), rgba(255,255,255,.08)); border: 1px solid rgba(255,255,255,.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 6px 16px rgba(0,0,0,.2); }
  img { width: 44px; height: 44px; }
  /* the sender's photo or initials fill the badge as a circle */
  .badge.face { border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,.55); }
  .badge.face img { width: 100%; height: 100%; object-fit: cover; filter: none !important; }
  .badge.face #initials { color: #fff; font-weight: 700; font-size: 22px; letter-spacing: .5px; }
  #initials { display: none; }
  .badge.letters img { display: none; }
  .badge.letters #initials { display: block; }
  body[data-design="minimal"] .badge.face #initials { font-size: 16px; }
  .text { position: relative; flex: 1; min-width: 0; }
  #title { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 30px; }
  #body { color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; margin-top: 3px; }
  #more { display: inline-block; margin-top: 7px; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; color: var(--ink);
    background: color-mix(in srgb, var(--accent) 42%, transparent); border: 1px solid rgba(255,255,255,.3); }
  #close { position: absolute; top: 10px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.14);
    color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; z-index: 2; }
  #close:hover { background: rgba(255,255,255,.34); }
  /* other designs (popup settings) */
  body[data-design="solid"] .card { background: rgb(var(--tint)); border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent); border-left: 8px solid var(--accent); border-radius: 18px;
    box-shadow: 0 6px 16px rgba(0,0,0,.34); -webkit-backdrop-filter: none; backdrop-filter: none; }
  body[data-design="solid"] .card::before, body[data-design="solid"] .card::after, body[data-design="minimal"] .card::before, body[data-design="minimal"] .card::after { display: none; }
  body[data-design="solid"] .badge { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: transparent; box-shadow: none; border-radius: 14px; }
  body[data-design="minimal"] .card { background: rgba(var(--tint), .94); border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); border-radius: 999px; padding: 10px 26px 10px 14px;
    box-shadow: 0 5px 14px rgba(0,0,0,.28); -webkit-backdrop-filter: none; backdrop-filter: none; height: auto; margin-top: 26px; }
  body[data-design="minimal"] .badge { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: 0; box-shadow: none; }
  body[data-design="minimal"] img { width: 28px; height: 28px; filter: brightness(0) invert(1); }
  body[data-design="minimal"] #body { -webkit-line-clamp: 1; }
  body[data-design="minimal"] #more { display: none; }
  body[data-design="minimal"] #close { top: 50%; transform: translateY(-50%); right: 14px; }
  body[data-design="neon"] .card { background: rgba(8, 10, 20, .92); border: 2px solid var(--accent); border-radius: 22px; color: #fff; --ink: #fff; --soft: rgba(255,255,255,.8);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 80%, transparent), inset 0 0 18px color-mix(in srgb, var(--accent) 28%, transparent); -webkit-backdrop-filter: none; backdrop-filter: none; }
  body[data-design="neon"] .card::before { display: none; }
  body[data-design="neon"] #title { color: var(--accent); text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
  body[data-design="neon"] .badge { background: none; border: 2px solid var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
  @keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.035); } 100% { transform: scale(1); } }
  @keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
  .text.pulse { animation: pulse .35s ease-out; }
  img.ring { animation: ring .7s ease-in-out .25s; }
  .still .text.pulse, .still img.ring, .still .card.shine::after { animation: none; }
  @media (prefers-reduced-motion: reduce) { .text.pulse, img.ring, .card.shine::after { animation: none; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge" id="badge"><img id="icon" src="icon.png" alt=""><span id="initials"></span></div>
    <div class="text"><div id="title"></div><div id="body"></div><div id="more"></div></div>
    <button id="close" title="Dismiss">×</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>

name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    # relay and documentation changes do not need new installers
    paths-ignore: ['relay/**', 'render.yaml', '**.md', '.github/**']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.os == 'ubuntu-latest'
        run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Apple Silicon refuses to start an app without at least an ad-hoc signature, so fail the build if it is missing.
      - if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/mac-arm64/TeamLink.app
          codesign --verify --deep --strict dist/mac/TeamLink.app
      - uses: actions/upload-artifact@v4
        with:
          name: TeamLink-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
      - id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Publishes the installers on the repository's Releases page as v<version from package.json>.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TeamLink ${{ steps.ver.outputs.version }}
          # The .yml and .blockmap files are what the in-app updater reads; they must be in the release.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
